# Normal kidney Visium HD — sequencing / binned.
dataset:
  name: kidney_visiumhd
  platform: visium_hd
  modality: sequencing
sample_name: KidneyHD

inputs:
  # 2um bins for Bin2Cell.
  input_h5ad:      ${SEGBENCH_DATA}/kidney_visiumhd_10x/segmented_outputs/binned_outputs/square_002um/filtered_feature_bc_matrix.h5
  spaceranger_dir: ${SEGBENCH_DATA}/kidney_visiumhd_10x/segmented_outputs/binned_outputs/square_002um
  source_image:    ${SEGBENCH_DATA}/kidney_visiumhd_10x/segmented_outputs/Visium_HD_Human_Kidney_FFPE_tissue_image.btf
  # 10x-provided cell segmentation, used by TRACER segmented mode.
  cell_geojson:    ${SEGBENCH_DATA}/kidney_visiumhd_10x/segmented_outputs/cell_segmentations.geojson
  nucleus_geojson: ${SEGBENCH_DATA}/kidney_visiumhd_10x/segmented_outputs/nucleus_segmentations.geojson
  segmented_h5:    ${SEGBENCH_DATA}/kidney_visiumhd_10x/segmented_outputs/filtered_feature_cell_matrix.h5
  # Naik healthy-control kidney scRNA (HC1-HC6), 15,198 cells / 9 lineages.
  # tracer_seq (no-seg) consumes the binned matrix directly, not a
  # transcript table.
  visiumhd_matrix: ${SEGBENCH_DATA}/kidney_visiumhd_10x/segmented_outputs/binned_outputs/square_002um/filtered_feature_bc_matrix
  spatial_dir:     ${SEGBENCH_DATA}/kidney_visiumhd_10x/segmented_outputs/binned_outputs/square_002um/spatial
  reference_h5ad:  /home/lyuan13/scr4_adeshpa6/TRACER/results/tracer_noseg/_ref/kidney_ref_noschwann.h5ad
  reference_celltype_col: cell_type
  pmi: /scratch4/adeshpa6/segbench_runs/kidney_visiumhd/reference/kidney_pmi.csv.gz

tracer:
  platform: visium_hd
