name: Cirro benchmark containers

on:
  push:
    branches: [feat/cirro-segbench-v0.1.0]
    paths:
      - "workflows/cirro/containers/**"
      - "workflows/cirro/bin/**"
      - "workflows/cirro/configs/**"
      - "src/**"
      - ".github/workflows/cirro-containers.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: analysis
            dockerfile: workflows/cirro/containers/analysis.Dockerfile
          - name: segger
            dockerfile: workflows/cirro/containers/segger.Dockerfile
          - name: tracer
            dockerfile: workflows/cirro/containers/tracer.Dockerfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/imlong4real/segbench-${{ matrix.name }}:cirro-${{ github.sha }}
          provenance: true
          sbom: true
      - name: Container contract smoke test
        env:
          IMAGE: ghcr.io/imlong4real/segbench-${{ matrix.name }}:cirro-${{ github.sha }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          if [[ "$IMAGE_NAME" == "analysis" ]]; then
            docker run --rm "$IMAGE" python -m segbench selftest
            docker run --rm "$IMAGE" Rscript -e 'stopifnot(requireNamespace("anndata", quietly=TRUE), requireNamespace("spacexr", quietly=TRUE), requireNamespace("SPLIT", quietly=TRUE), requireNamespace("cellAdmix", quietly=TRUE))'
          elif [[ "$IMAGE_NAME" == "segger" ]]; then
            docker run --rm "$IMAGE" bash -lc 'test "$(cat /opt/container-manifest/segger-commit.txt)" = "ca7bf1caaf9a177dd1f3f9051f020d2e7d3937ac"'
            docker run --rm "$IMAGE" python -c 'import importlib.metadata as m; print(m.version("segger"))'
          else
            docker run --rm "$IMAGE" ps --version
            docker run --rm "$IMAGE" python -c 'import tracer; print(tracer.__version__)'
          fi
