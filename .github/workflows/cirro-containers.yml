name: Cirro benchmark containers

on:
  push:
    branches: [feat/cirro-segbench-v0.1.0]
    paths:
      - "workflows/cirro/containers/**"
      - "workflows/cirro/bin/**"
      - "workflows/cirro/configs/**"
      - "src/**"
      - ".github/workflows/cirro-containers.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: analysis
            dockerfile: workflows/cirro/containers/analysis.Dockerfile
          - name: segger
            dockerfile: workflows/cirro/containers/segger.Dockerfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/imlong4real/segbench-${{ matrix.name }}:cirro-${{ github.sha }}
          provenance: true
          sbom: true
